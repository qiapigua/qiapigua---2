<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>皮瓜软件站</title>
    <style>
        :root{
            --bg-gradient-1: #f6f8fc;
            --bg-gradient-2: #edf1f8;
            --bg-gradient-3: #f2f5fa;
            --card-bg: rgba(255,255,255,0.85);
            --popup-bg: rgba(255,255,255,0.95);
            --popup-head-bg: linear-gradient(135deg,#ffffff,#f8fafd);
            --iframe-bg: #fafbfd;
            --text-color: #1a202c;
            --border-light: rgba(255,255,255,0.9);
            --border-normal: rgba(0,0,0,0.05);
        }
        @media (prefers-color-scheme: dark) {
            :root{
                --bg-gradient-1: #0f141e;
                --bg-gradient-2: #161c29;
                --bg-gradient-3: #111722;
                --card-bg: rgba(30,38,54,0.85);
                --popup-bg: rgba(22,28,41,0.95);
                --popup-head-bg: linear-gradient(135deg,#1e2638,#171e2c);
                --iframe-bg: #141a27;
                --text-color: #e8edf7;
                --border-light: rgba(70,85,110,0.35);
                --border-normal: rgba(255,255,255,0.08);
            }
        }

        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            width:100%;
            min-height:100vh;
            background: linear-gradient(145deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 50%, var(--bg-gradient-3) 100%);
            display:flex;
            flex-direction:column;
            align-items:center;
            padding-top:130px;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background 0.4s ease;
        }

        .title{
            font-size:40px;
            font-weight:700;
            background: linear-gradient(90deg, #8892b0, #4080ff, #8892b0);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom:80px;
            letter-spacing:8px;
            animation: titleShine 6s ease-in-out infinite;
            text-shadow: 0 4px 20px rgba(64,128,255,0.15);
        }
        @keyframes titleShine{
            0%,100%{background-position:0% 50%;}
            50%{background-position:200% 50%;}
        }

        .btn-wrapper{
            width:82%;
            max-width:330px;
            display:flex;
            flex-direction:column;
            gap:26px;
        }

        .install-btn{
            display:flex;
            align-items:center;
            justify-content:center;
            width:100%;
            height:64px;
            padding:0;
            text-align:center;
            background: var(--card-bg);
            color:var(--text-color);
            text-decoration:none;
            border-radius:22px;
            font-size:17px;
            font-weight:600;
            border:1px solid var(--border-light);
            box-shadow:
                0 4px 15px rgba(0,0,0,0.05),
                0 8px 30px rgba(64,128,255,0.08),
                inset 0 1px 0 rgba(255,255,255,0.06);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position:relative;
            overflow:hidden;
        }

        .install-btn::before{
            content:'';
            position:absolute;
            top:0;
            left:-100%;
            width:100%;
            height:100%;
            background: linear-gradient(90deg,transparent,rgba(64,128,255,0.12),transparent);
            transition:left 0.6s ease;
        }
        .install-btn:hover::before{
            left:100%;
        }

        .install-btn:hover{
            color:#4080ff;
            transform: translateY(-6px) scale(1.02);
            box-shadow:
                0 8px 25px rgba(64,128,255,0.18),
                0 12px 40px rgba(64,128,255,0.12);
            border-color:rgba(64,128,255,0.25);
        }
        .install-btn:active{
            transform: translateY(-1px) scale(0.99);
            box-shadow: 0 4px 12px rgba(64,128,255,0.15);
        }

        .popup-mask{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(15,20,30,0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .popup-mask.hidden-view{
            opacity: 0;
            pointer-events: none;
            transform: translate(-9999px, -9999px);
        }

        .popup-box{
            width:94%;
            max-width:440px;
            height:75vh;
            background:var(--popup-bg);
            border-radius:28px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.25),
                0 8px 24px rgba(64,128,255,0.1);
            border:1px solid var(--border-light);
        }

        .popup-head{
            padding:20px 24px;
            background: var(--popup-head-bg);
            color:var(--text-color);
            border-bottom:1px solid var(--border-normal);
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:18px;
            font-weight:600;
            letter-spacing:1px;
        }

        .close-btn{
            border:none;
            background: linear-gradient(135deg,#f0f4fb,#e8eef8);
            color:#4080ff;
            border-radius:14px;
            padding:8px 18px;
            cursor:pointer;
            font-weight:600;
            transition:0.3s ease;
            box-shadow:0 2px 8px rgba(64,128,255,0.1);
        }
        @media (prefers-color-scheme: dark) {
            .close-btn{
                background: linear-gradient(135deg,#26334e,#202b42);
            }
        }
        .close-btn:hover{
            background: linear-gradient(135deg,#4080ff,#6399ff);
            color:#fff;
            box-shadow:0 4px 15px rgba(64,128,255,0.25);
            transform:scale(1.05);
        }
        .close-btn:active{
            transform:scale(0.96);
        }

        .popup-iframe{
            flex:1;
            width:100%;
            border:none;
            background:var(--iframe-bg);
        }
    </style>
</head>
<body>
    <div class="title">皮瓜软件站</div>

    <div class="btn-wrapper">
        <a href="https://www.123912.com/s/6IgiVv-SuLfA" class="install-btn">更多版本前往云盘</a>
        <a href="javascript:openPopup('https://easylink.cc/ojvp99','皮瓜软件站1.0')" class="install-btn">1、皮瓜软件站1.0</a>
        <a href="javascript:openPopup('https://easylink.cc/kgdajh','26幻想节自带连网人物')" class="install-btn">2、26幻想节自带连网人物</a>
        <a href="javascript:openPopup('https://easylink.cc/sst4iw','皮瓜星空开罗2.0')" class="install-btn">3、皮瓜星空开罗2.0</a>
        <a href="javascript:openPopup('https://easylink.cc/yfrzc9','花扇魔改双旦')" class="install-btn">4、花扇魔改双旦</a>
        <a href="javascript:openPopup('https://easylink.cc/9xg47h','皮瓜魔改国服洛阳')" class="install-btn">5、皮瓜魔改国服洛阳</a>
        <a href="javascript:openPopup('https://easylink.cc/enqsjp','皮瓜2.4w粉公益版本')" class="install-btn">6、皮瓜2.4w粉公益版本</a>
        <a href="javascript:openPopup('https://easylink.cc/r6b1uv','老北京新触控')" class="install-btn">7、老北京新触控</a>
        <a href="javascript:openPopup('https://easylink.cc/dqcrlh','Eurfex圣彼得堡')" class="install-btn">8、Eurfex圣彼得堡</a>
        <a href="javascript:openPopup('https://easylink.cc/sx401p','皮瓜16.0联动凉茶')" class="install-btn">9、皮瓜16.0联动凉茶</a>
        <a href="javascript:openPopup('https://easylink.cc/1oj2o0','落日哥本哈根')" class="install-btn">10、落日哥本哈根</a>
        <a href="javascript:openPopup('https://easylink.cc/nj5l6h','老拉斯维加斯新触控')" class="install-btn">11、老拉斯维加斯新触控</a>
    </div>

    <div class="popup-mask" id="popupMask">
        <div class="popup-box">
            <div class="popup-head">
                <span id="popupTitle"></span>
                <button class="close-btn" onclick="realClosePopup()">关闭</button>
            </div>
            <iframe class="popup-iframe" id="iframeView" src=""></iframe>
        </div>
    </div>

    <script>
        const mask = document.getElementById('popupMask');
        const iframe = document.getElementById('iframeView');
        let autoCloseTimer = null;

        function openPopup(url,title){
            clearTimeout(autoCloseTimer);
            mask.classList.remove('hidden-view');
            document.getElementById('popupTitle').innerText = title;
            iframe.src = url;
            mask.style.display = 'flex';

            setTimeout(() => {
                mask.classList.add('hidden-view');
            }, 1);

            autoCloseTimer = setTimeout(() => {
                realClosePopup();
            }, 3000);
        }

        function realClosePopup(){
            clearTimeout(autoCloseTimer);
            mask.classList.remove('hidden-view');
            mask.style.display = 'none';
            iframe.src = '';
        }

        mask.addEventListener('click',function(e){
            if(e.target === this){
                realClosePopup();
            }
        })
    </script>
</body>
</html>
