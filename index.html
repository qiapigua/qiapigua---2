    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            width:100%;
            min-height:100vh;
            background: linear-gradient(145deg, #f6f8fc 0%, #edf1f8 50%, #f2f5fa 100%);
            display:flex;
            flex-direction:column;
            align-items:center;
            padding-top:130px;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .title{
            font-size:40px;
            font-weight:700;
            background: linear-gradient(90deg, #252a34, #4080ff, #252a34);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom:80px;
            letter-spacing:8px;
            animation: titleShine 6s ease-in-out infinite;
            text-shadow: 0 4px 20px rgba(64,128,255,0.15);
        }
        @keyframes titleShine{
            0%,100%{background-position:0% 50%;}
            50%{background-position:200% 50%;}
        }

        .btn-wrapper{
            width:82%;
            max-width:330px;
            display:flex;
            flex-direction:column;
            gap:26px;
        }

        .install-btn{
            display:flex;
            align-items:center;
            justify-content:center;
            width:100%;
            height:64px;
            padding:0;
            text-align:center;
            background: rgba(255,255,255,0.85);
            color:#1a202c;
            text-decoration:none;
            border-radius:22px;
            font-size:17px;
            font-weight:600;
            border:1px solid rgba(255,255,255,0.9);
            box-shadow: 
                0 4px 15px rgba(0,0,0,0.05),
                0 8px 30px rgba(64,128,255,0.08),
                inset 0 1px 0 rgba(255,255,255,0.9);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position:relative;
            overflow:hidden;
        }

        .install-btn::before{
            content:'';
            position:absolute;
            top:0;
            left:-100%;
            width:100%;
            height:100%;
            background: linear-gradient(90deg,transparent,rgba(64,128,255,0.12),transparent);
            transition:left 0.6s ease;
        }
        .install-btn:hover::before{
            left:100%;
        }

        .install-btn:hover{
            color:#4080ff;
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 25px rgba(64,128,255,0.18),
                0 12px 40px rgba(64,128,255,0.12);
            border-color:rgba(64,128,255,0.25);
        }
        .install-btn:active{
            transform: translateY(-1px) scale(0.99);
            box-shadow: 0 4px 12px rgba(64,128,255,0.15);
        }

        .popup-mask{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(15,20,30,0.25);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
            animation: maskFade 0.3s ease;
        }
        @keyframes maskFade{
            from{opacity:0;}
            to{opacity:1;}
        }

        .popup-box{
            width:94%;
            max-width:440px;
            height:75vh;
            background:rgba(255,255,255,0.95);
            border-radius:28px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.12),
                0 8px 24px rgba(64,128,255,0.1);
            border:1px solid rgba(255,255,255,0.9);
            animation: popupScale 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popupScale{
            from{transform:scale(0.92);opacity:0;}
            to{transform:scale(1);opacity:1;}
        }

        .popup-head{
            padding:20px 24px;
            background: linear-gradient(135deg,#ffffff,#f8fafd);
            color:#1a202c;
            border-bottom:1px solid rgba(0,0,0,0.05);
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:18px;
            font-weight:600;
            letter-spacing:1px;
        }

        .close-btn{
            border:none;
            background: linear-gradient(135deg,#f0f4fb,#e8eef8);
            color:#4080ff;
            border-radius:14px;
            padding:8px 18px;
            cursor:pointer;
            font-weight:600;
            transition:0.3s ease;
            box-shadow:0 2px 8px rgba(64,128,255,0.1);
        }
        .close-btn:hover{
            background: linear-gradient(135deg,#4080ff,#6399ff);
            color:#fff;
            box-shadow:0 4px 15px rgba(64,128,255,0.25);
            transform:scale(1.05);
        }
        .close-btn:active{
            transform:scale(0.96);
        }

        .popup-iframe{
            flex:1;
            width:100%;
            border:none;
            background:#fafbfd;
        }
    </style>
</head>
<body>

    <div class="popup-mask" id="popupMask">
        <div class="popup-box">

    <script>
        function openPopup(url,title){
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('iframeView').src = url;
            document.getElementById('popupMask').style.display = 'flex';
            setTimeout(() => {
                closePopup();
            }, 1);
        }
        function closePopup(){
            document.getElementById('popupMask').style.display = 'none';
        }
    </script>
